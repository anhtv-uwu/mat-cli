name: Verify MAT 1.17 bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build plugin and test packaging logic
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/maven.tar.gz" https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/apache-maven-3.9.16/bin:$PATH"
          mvn -B verify
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-plugin
          path: CliMatRepository/target/repository/plugins/CliMatPlugin_*.jar
          if-no-files-found: error
  bundle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-plugin
          path: build/plugin
      - name: Package and test on native OS and architecture
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/ci_bundle.py "$TARGET_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-cli-${{ matrix.platform }}
          path: |
            build/mat-cli-${{ matrix.platform }}.tar.gz*
            build/mat-cli-${{ matrix.platform }}.zip*
          if-no-files-found: error
